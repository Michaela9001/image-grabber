<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>拾图图库 · PixHarvest</title>
    <link rel="stylesheet" href="gallery.css" />
  </head>
  <body>
    <div class="bg-aurora" aria-hidden="true"></div>

    <header class="topbar">
      <div class="brand">
        <img class="brand__logo" src="icons/icon48.png" width="40" height="40" alt="拾图" />
        <div class="brand__text">
          <h1>拾图图库</h1>
          <p class="brand__meta" id="sourceMeta">还没有提取任何图片</p>
        </div>
      </div>

      <div class="actions" role="toolbar" aria-label="图库操作">
        <button type="button" class="btn" id="selectAllBtn">全选</button>
        <button type="button" class="btn" id="invertBtn">反选</button>
        <button type="button" class="btn btn--danger" id="clearBtn">清空</button>
        <button type="button" class="btn btn--primary" id="downloadBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 4v11"></path>
            <path d="M7.5 10.5L12 15l4.5-4.5"></path>
            <path d="M4.5 19.5h15"></path>
          </svg>
          <span id="downloadLabel">批量下载 PNG</span>
        </button>
      </div>
    </header>

    <main>
      <section class="summary" aria-live="polite">
        <div class="summary__stats">
          <span class="pill" id="countLabel">0 张图片</span>
          <span class="pill pill--accent" id="selectedLabel">已选 0 张</span>
        </div>
        <p class="summary__hint">
          点击图片查看大图 · <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>A</kbd> 全选 · <kbd>Esc</kbd> 关闭预览
        </p>
      </section>

      <section class="grid" id="grid"></section>

      <section class="empty" id="empty">
        <div class="empty__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3" y="4.5" width="18" height="15" rx="2.4"></rect>
            <circle cx="8.6" cy="9.6" r="1.5"></circle>
            <path d="M20.4 15.6l-4.9-4.9a1.5 1.5 0 0 0-2.1 0L6 18.1"></path>
          </svg>
        </div>
        <h2>图库还是空的</h2>
        <p>
          打开任意电商商品详情页，点击右下角紫色的「获取图片」按钮，
          主图、SKU 图与详情长图就会集中到这里。
        </p>
        <ol class="empty__steps">
          <li>打开商品详情页</li>
          <li>点击「获取图片」</li>
          <li>勾选后批量下载 PNG</li>
        </ol>
      </section>
    </main>

    <div class="lightbox" id="lightbox" hidden>
      <div class="lightbox__bar">
        <span class="lightbox__counter" id="lightboxCounter">1 / 1</span>
        <div class="lightbox__tools">
          <button type="button" class="btn btn--small" id="lightboxDownload">下载这张</button>
          <a class="btn btn--small btn--link" id="lightboxOpen" target="_blank" rel="noreferrer noopener">
            新标签打开
          </a>
          <button type="button" class="btn btn--small" id="lightboxClose">关闭</button>
        </div>
      </div>

      <button type="button" class="lightbox__nav lightbox__nav--prev" id="lightboxPrev" aria-label="上一张">
        ‹
      </button>
      <img class="lightbox__image" id="lightboxImage" alt="图片预览" />
      <button type="button" class="lightbox__nav lightbox__nav--next" id="lightboxNext" aria-label="下一张">
        ›
      </button>
    </div>

    <div class="progress" id="progress" hidden>
      <div class="progress__head">
        <span id="progressText">正在转换并下载…</span>
        <span id="progressCount">0 / 0</span>
      </div>
      <div class="progress__track">
        <div class="progress__bar" id="progressBar"></div>
      </div>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="gallery.js"></script>
  </body>
</html>
